name: Reynolds and Reynolds
kind: company
description: >-
  Reynolds and Reynolds is one of the automotive industry's largest Dealership
  Management System (DMS) providers, running the ERA-IGNITE and POWER platforms
  that operate the core of thousands of franchised car dealerships - sales and
  desking, F&I, service and repair orders, parts inventory, CRM, and dealership
  accounting. Reynolds does NOT publish an open, self-serve developer API. All
  programmatic access to DMS data flows through the Reynolds Certified Interface
  (RCI) program, a certification-gated, contract-and-NDA partner program run by
  Reynolds Data Management. RCI provides secured, real-time, bi-directional
  interfaces so certified third parties can read from and write back to a
  dealer's Reynolds DMS. There is no public developer portal, no public API
  reference, and no published OpenAPI. The APIs below are logical groupings of
  the DMS data domains exposed through RCI; endpoints are modeled, not sourced
  from public documentation.
